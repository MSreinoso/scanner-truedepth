name: Compilar IPA iOS TrueDepth 3D

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen y generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' TrueDepth3DScanner.xcodeproj/project.pbxproj

      - name: Compilar aplicación para iPhone (Release)
        run: |
          xcodebuild -project TrueDepth3DScanner.xcodeproj \
            -scheme TrueDepth3DScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Empaquetar en archivo .ipa
        run: |
          APP_PATH=$(find . -name "TrueDepth3DScanner.app" -type d | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/TrueDepth3DScanner.ipa" Payload

      - name: Subir Artifact IPA para Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: TrueDepth3DScanner-IPA
          path: TrueDepth3DScanner.ipa
