name: Compilar IPA iOS TrueDepth 3D

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Windows/requirements-build.txt
      - name: Instalar dependencias
        run: python -m pip install -r Windows/requirements-build.txt
      - name: Probar protocolo
        working-directory: Windows
        run: python -m unittest discover -p "test_*.py" -v
      - name: Crear ejecutable portátil
        working-directory: Windows
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name Bichito3D --add-data "bichito_pro_icon_1024.png;."
          --collect-all open3d --copy-metadata open3d
          --exclude-module torch --exclude-module tensorflow
          --exclude-module jax --exclude-module IPython
          --exclude-module cupy --exclude-module kornia
          --exclude-module matplotlib.tests
          Bichito3D_ReconstructionEngine.py
      - name: Incluir fuentes RTX y modelo neuronal entrenado
        shell: pwsh
        run: |
          Copy-Item Windows/*.py Windows/dist/Bichito3D/
          Copy-Item Windows/*.bat Windows/dist/Bichito3D/
          Copy-Item Windows/requirements-gpu.txt Windows/dist/Bichito3D/
          Copy-Item Windows/models Windows/dist/Bichito3D/models -Recurse
          Copy-Item DEPTH_MODEL_RESEARCH.md Windows/dist/Bichito3D/
      - name: Subir app Windows
        uses: actions/upload-artifact@v4
        with:
          name: Bichito3D-Windows
          path: Windows/dist/Bichito3D/
          compression-level: 6
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Instalar XcodeGen y generar proyecto
        run: |
          brew install xcodegen
          xcodegen generate
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' TrueDepth3DScanner.xcodeproj/project.pbxproj

      - name: Compilar aplicación para iPhone (Release)
        run: |
          xcodebuild -project TrueDepth3DScanner.xcodeproj \
            -scheme TrueDepth3DScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Verificar compresión Swift y compatibilidad Python
        run: |
          brew install zstd
          python3 -m venv build/codec-env
          build/codec-env/bin/pip install numpy Pillow zstandard
          swiftc TrueDepth3DScanner/CaptureRecorder.swift TrueDepth3DScanner/LosslessFrameCodec.swift Tests/main.swift -import-objc-header TrueDepth3DScanner/Scanner-Bridging-Header.h -I "$(brew --prefix zstd)/include" -L "$(brew --prefix zstd)/lib" -lzstd -o build/compression-test
          build/compression-test build/compression-fixture
          python3 -c "from pathlib import Path; import zlib, hashlib; p=Path('build/compression-fixture'); raw=(p/'compressor.b3draw').read_bytes(); encoded=(p/'compressor.b3dz').read_bytes(); assert zlib.decompress(encoded,-15)==raw; assert hashlib.sha256(encoded).hexdigest()==(p/'compressor.b3dz.sha256').read_text(); print('Swift/Python compression OK')"
          PYTHONPATH=Windows build/codec-env/bin/python -c "from pathlib import Path; from chunk_protocol import decode_lossless_packet; p=Path('build/compression-fixture'); a=decode_lossless_packet((p/'frame0.b3dc').read_bytes()); b=decode_lossless_packet((p/'frame1.b3dc').read_bytes(),a); assert a==(p/'frame0.raw').read_bytes(); assert b==(p/'frame1.raw').read_bytes(); print('PNG/Zstd/repeat bit-exact round trip OK')"

      - name: Empaquetar en archivo .ipa
        run: |
          APP_PATH=$(find . -name "TrueDepth3DScanner.app" -type d | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r "$GITHUB_WORKSPACE/TrueDepth3DScanner.ipa" Payload

      - name: Subir Artifact IPA para Sideloadly
        uses: actions/upload-artifact@v4
        with:
          name: TrueDepth3DScanner-IPA
          path: TrueDepth3DScanner.ipa
