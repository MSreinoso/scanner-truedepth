name: TrueDepth3DScanner
options:
  bundleIdPrefix: com.scanner3d
  deploymentTarget:
    iOS: "16.0"
targets:
  Zstd:
    type: library.static
    platform: iOS
    sources:
      - Vendor/zstd/lib/common
      - Vendor/zstd/lib/compress
      - Vendor/zstd/lib/decompress
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "ZSTD_DISABLE_ASM=1"]
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/zstd/lib"
  TrueDepth3DScanner:
    type: application
    platform: iOS
    dependencies:
      - target: Zstd
    sources:
      - TrueDepth3DScanner
    info:
      path: TrueDepth3DScanner/Info.plist
      properties:
        CFBundleDisplayName: "Bichito 3D Pro"
        CFBundleShortVersionString: "3.0"
        CFBundleVersion: "4"
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Se requiere acceso a la cámara TrueDepth (Face ID) para capturar el mapa de profundidad y reconstruir la geometría 3D."
        NSLocalNetworkUsageDescription: "Se utiliza la red Wi-Fi local para transmitir la vista del escáner 3D en tiempo real hacia el navegador de tu PC."
        NSMotionUsageDescription: "Se requiere acceso a los sensores de movimiento para estabilizar y anclar la nube de puntos 3D en el espacio real."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: TrueDepth3DScanner/Scanner-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/zstd/lib"
        PRODUCT_BUNDLE_IDENTIFIER: com.scanner3d.truedepthstl
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
